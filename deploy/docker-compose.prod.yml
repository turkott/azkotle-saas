name: azkotle-prod

# Compose pro VPS AA-kotle.
# - app:  Blazor Web na app.az-kotle.cz
# - api:  ASP.NET Core API na api.az-kotle.cz
# - postgres + redis + seq (privátní, dostupné jen v internal síti)
# - caddy: reverse proxy + auto-HTTPS pro veřejné domény
# - postgres-backup: denní pg_dump → Backblaze B2
#
# Spuštění:  docker compose -f deploy/docker-compose.prod.yml --env-file .env.prod up -d
# Update:    docker compose -f deploy/docker-compose.prod.yml --env-file .env.prod pull && docker compose ... up -d
#
# Observability (volitelné, neaktivní defaultně):
# - Logs: api/app posílají do Seq (http://seq:80) přes Serilog. Otevři v UI:
#   ssh tunelem `ssh -L 8081:localhost:80 root@vps` → http://localhost:8081
# - Metrics: api/app vystavují /metrics (prometheus-net), Caddy je blokuje
#   navenek. Pro scrape přidej prometheus + grafana sidecary, viz
#   deploy/grafana/dashboards/overview.json (skeleton dashboard).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      # Heslo pro non-superuser runtime roli azkotle_app, vytvořenou
      # init scriptem postgres/init/01-create-app-role.sh.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount init scriptů — Docker postgres image je spustí JEN při prvním
      # vytvoření datového adresáře. Pro existující volume použij ručně:
      #   deploy/postgres/apply-app-role.sh
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # SEQ_FIRSTRUN_ADMINPASSWORDHASH set in .env.prod (use `seq config hash <pwd>` to generate).
      SEQ_FIRSTRUN_ADMINPASSWORDHASH: ${SEQ_ADMIN_PASSWORD_HASH}
    volumes:
      - seq_data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/api/"]
      interval: 30s
      timeout: 5s
      retries: 6
    networks: [internal]

  # One-shot DDL migrator. Spouští se jednou při každém deployi PŘED api/app —
  # Compose `service_completed_successfully` zajistí, že rollout halts pokud
  # migrátor exit != 0. Image identický s api, jen jiný entrypoint.
  #
  # Bezpečnostní invariant: migrátor používá POSTGRES_USER (superuser, DDL-capable).
  # Runtime api/app používá azkotle_app (NOSUPERUSER NOBYPASSRLS) — superuser
  # tiše obchází FORCE ROW LEVEL SECURITY, takže pokud by api jelo jako superuser,
  # tenant_isolation by se vypnul a tenanti by viděli data ostatních.
  migrator:
    image: ghcr.io/turkott/azkotle-api:${AZKOTLE_IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # SUPERUSER credentials — pouze pro DDL. Nikdy NEcopyovat tento connection
      # string do runtime api/app environment.
      ConnectionStrings__AzKotleDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    entrypoint: ["dotnet", "AzKotle.Api.dll", "--apply-migrations"]
    networks: [internal]

  api:
    image: ghcr.io/turkott/azkotle-api:${AZKOTLE_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Runtime: API se připojuje jako non-superuser azkotle_app (NOSUPERUSER
      # NOBYPASSRLS) — bez toho by superuser tichá obcházel celou tenant_isolation
      # RLS politiku. Migrace se NESPOUŠTÍ z runtime kontejneru — běží v 'migrator'
      # sidecaru jako ${POSTGRES_USER}, viz deploy/postgres/README.md.
      ConnectionStrings__AzKotleDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${APP_DB_USER:-azkotle_app};Password=${APP_DB_PASSWORD};Pooling=true;Maximum Pool Size=20"
      Jwt__Issuer: "https://api.az-kotle.cz"
      Jwt__Audience: "azkotle-api"
      Jwt__Secret: ${AZKOTLE_JWT_SECRET:?AZKOTLE_JWT_SECRET must be set (>= 32 chars)}
      Jwt__AccessTokenMinutes: "15"
      Jwt__RefreshTokenDays: "30"
      Storage__Bucket: ${STORAGE_BUCKET}
      Storage__ServiceUrl: ${STORAGE_SERVICE_URL}
      Storage__Region: ${STORAGE_REGION}
      Storage__AccessKey: ${STORAGE_ACCESS_KEY}
      Storage__SecretKey: ${STORAGE_SECRET_KEY}
      Storage__ForcePathStyle: "true"
      Cors__AllowedOrigins__0: "https://app.az-kotle.cz"
      Cors__AllowedOrigins__1: "https://az-kotle.cz"
      Cors__AllowedOrigins__2: "https://www.az-kotle.cz"
      Serilog__Seq__ServerUrl: "http://seq:80"
      Serilog__Seq__ApiKey: ${SEQ_API_KEY:-}
    networks: [internal]

  app:
    image: ghcr.io/turkott/azkotle-web:${AZKOTLE_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Api__BaseAddress: "https://api.az-kotle.cz"
      Serilog__Seq__ServerUrl: "http://seq:80"
      Serilog__Seq__ApiKey: ${SEQ_API_KEY:-}
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal, public]

  postgres-backup:
    build:
      context: ./postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      STORAGE_SERVICE_URL: ${STORAGE_SERVICE_URL}
      STORAGE_REGION: ${STORAGE_REGION}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${BACKUP_BUCKET:-${STORAGE_BUCKET}}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-backups/postgres}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      BACKUP_RUN_ON_START: "false"
    networks: [internal]

volumes:
  postgres_data:
  redis_data:
  seq_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: false
  public:
